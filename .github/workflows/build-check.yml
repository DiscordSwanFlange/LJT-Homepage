name: Jekyll build check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: List generated publications and index
        run: |
          echo "=== _site root ==="
          ls _site | head -30
          echo "=== _site/publications ==="
          ls _site/publications
          echo "=== index title check ==="
          grep -o "Junteng Liu" _site/index.html | head -3
          grep -c "SynLogic" _site/index.html
